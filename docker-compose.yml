# Lumen Market with Docker: web server, background scheduler, PostgreSQL and Redis (Valkey).
#
#   cp .env.example .env        # then set SECRET_KEY (and your keys)
#   docker compose up -d --build
#   docker compose exec web python manage.py createsuperuser
#   open http://localhost:8000
#
# Full guide: DOCKER.md

x-app: &app
  build: .
  image: lumen-market:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-lumen}:${POSTGRES_PASSWORD:-lumen-local-password}@db:5432/${POSTGRES_DB:-lumen}
    DATABASE_SSL: "False"   # the database runs next to the app, inside Docker
    REDIS_URL: redis://redis:6379/0
    DEBUG: ${DEBUG:-False}
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env - see DOCKER.md}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    # Behind an HTTPS proxy (Caddy, Nginx, a load balancer) set this to True and NUM_PROXIES=1.
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
    NUM_PROXIES: ${NUM_PROXIES:-0}
    # Keys & passwords (store admin) are saved here, in the "config" volume.
    ENV_FILE: /app/config/.env
    RELOAD_WITH_HUP: "1"   # saving keys in the admin restarts the web workers
  volumes:
    - config:/app/config
    - media:/app/media
    - private_media:/app/private_media
    - backups:/app/backups
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *app
    command: ["web"]
    ports:
      - "${WEB_PORT:-8000}:8000"

  scheduler:
    <<: *app
    command: ["scheduler"]
    healthcheck:
      disable: true

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumen}
      POSTGRES_USER: ${POSTGRES_USER:-lumen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumen-local-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumen} -d ${POSTGRES_DB:-lumen}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Valkey: the open-source (BSD) continuation of Redis, fully compatible.
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data

volumes:
  config:
  pgdata:
  redisdata:
  media:
  private_media:
  backups:
