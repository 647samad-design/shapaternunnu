<form method="get" class="sort-form">
    {% for key, vals in request.GET.lists %}{% if key != 'sort' and key != 'page' %}{% for val in vals %}<input type="hidden" name="{{ key }}" value="{{ val }}">{% endfor %}{% endif %}{% endfor %}
    <label for="sort-select" class="sr-only">Sort by</label>
    <select id="sort-select" name="sort" onchange="this.form.submit()">
        <option value="" {% if not current_sort %}selected{% endif %}>Sort: Recommended</option>
        <option value="price_asc" {% if current_sort == "price_asc" %}selected{% endif %}>{{ t.price_low_high }}</option>
        <option value="price_desc" {% if current_sort == "price_desc" %}selected{% endif %}>{{ t.price_high_low }}</option>
        <option value="newest" {% if current_sort == "newest" %}selected{% endif %}>{{ t.newest_first }}</option>
        <option value="rating" {% if current_sort == "rating" %}selected{% endif %}>{{ t.top_rated }}</option>
        <option value="popular" {% if current_sort == "popular" %}selected{% endif %}>Best selling</option>
    </select>
    <noscript><button type="submit" class="btn btn-secondary btn-sm">Sort</button></noscript>
</form>
