<div class="field"><label for="c-name-{{ c.id|default:'new' }}">Name</label><input id="c-name-{{ c.id|default:'new' }}" name="name" maxlength="60" required value="{{ c.name|default:'' }}"></div>
<div class="field"><label for="c-par-{{ c.id|default:'new' }}">Inside</label><select id="c-par-{{ c.id|default:'new' }}" name="parent"><option value="">Nothing (top-level)</option>{% for t in tops %}{% if t.id != c.id %}<option value="{{ t.id }}"{% if c.parent_id == t.id %} selected{% endif %}>{{ t.name }}</option>{% endif %}{% endfor %}</select></div>
<div class="field"><label for="c-pos-{{ c.id|default:'new' }}">Order</label><input id="c-pos-{{ c.id|default:'new' }}" name="position" type="number" min="0" max="9999" value="{{ c.position|default:0 }}"></div>
<label class="small" style="display:flex;gap:6px;align-items:center;align-self:end;padding-bottom:10px;"><input type="checkbox" name="is_active" value="1"{% if not c or c.is_active %} checked{% endif %}> Visible in the shop</label>
<div class="field wide"><label for="c-desc-{{ c.id|default:'new' }}">Description (optional)</label><input id="c-desc-{{ c.id|default:'new' }}" name="description" maxlength="300" value="{{ c.description|default:'' }}" placeholder="Shown at the top of the category page and in Google"></div>
<div class="field wide"><label for="c-img-{{ c.id|default:'new' }}">Picture URL (optional)</label><input id="c-img-{{ c.id|default:'new' }}" name="image_url" maxlength="500" value="{{ c.image_url|default:'' }}" placeholder="https://… - empty uses a product photo"></div>
<div class="field wide"><label for="c-size-{{ c.id|default:'new' }}">Size guide (optional)</label><textarea id="c-size-{{ c.id|default:'new' }}" name="size_chart" rows="4" placeholder="Size | Chest (cm) | Length (cm)&#10;S | 88-94 | 68&#10;M | 96-102 | 71">{{ c.size_chart|default:'' }}</textarea><small class="muted">One row per line, columns separated by |. The first line is the heading. Shown on product pages in this category (and its subcategories).</small></div>
