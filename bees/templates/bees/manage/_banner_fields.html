<div class="field"><label for="b-t-{{ b.id|default:'new' }}">Title</label><input id="b-t-{{ b.id|default:'new' }}" name="title" maxlength="80" required value="{{ b.title|default:'' }}" placeholder="Summer sale: up to 40% off"></div>
<div class="field"><label for="b-s-{{ b.id|default:'new' }}">Line under it (optional)</label><input id="b-s-{{ b.id|default:'new' }}" name="subtitle" maxlength="160" value="{{ b.subtitle|default:'' }}"></div>
<div class="field"><label for="b-l-{{ b.id|default:'new' }}">Link</label><input id="b-l-{{ b.id|default:'new' }}" name="link" maxlength="300" required value="{{ b.link|default:'' }}" placeholder="/category/fashion/"></div>
<div class="field"><label for="b-bl-{{ b.id|default:'new' }}">Button text</label><input id="b-bl-{{ b.id|default:'new' }}" name="button_label" maxlength="30" value="{{ b.button_label|default:'Shop now' }}"></div>
<div class="field wide"><label for="b-i-{{ b.id|default:'new' }}">Picture URL (optional)</label><input id="b-i-{{ b.id|default:'new' }}" name="image_url" maxlength="500" value="{{ b.image_url|default:'' }}" placeholder="https://… wide picture, about 1200 x 600"></div>
<div class="field"><label for="b-st-{{ b.id|default:'new' }}">Show from (optional)</label><input id="b-st-{{ b.id|default:'new' }}" name="starts_at" type="datetime-local" value="{{ b.starts_at|date:'Y-m-d\TH:i' }}"></div>
<div class="field"><label for="b-en-{{ b.id|default:'new' }}">Hide after (optional)</label><input id="b-en-{{ b.id|default:'new' }}" name="ends_at" type="datetime-local" value="{{ b.ends_at|date:'Y-m-d\TH:i' }}"></div>
<div class="field"><label for="b-p-{{ b.id|default:'new' }}">Order</label><input id="b-p-{{ b.id|default:'new' }}" name="position" type="number" min="0" max="999" value="{{ b.position|default:0 }}"></div>
<label class="small" style="display:flex;gap:6px;align-items:center;align-self:end;padding-bottom:10px;"><input type="checkbox" name="is_active" value="1"{% if not b or b.is_active %} checked{% endif %}> Showing</label>
